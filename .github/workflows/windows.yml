name: Windows build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release installer to test, or leave empty to build from source
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - src/**
      - src-tauri/**
      - public/**
      - tests/**
      - package*.json
      - index.html
      - vite.config.ts
      - .github/workflows/windows.yml
      - scripts/windows-smoke.py

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PUBLISHED_RELEASE: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rust toolchain
        run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-all-crates: true
      - run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Frontend production build
        run: npm run build
      - name: Accounting, storage, pricing, and Windows credentials
        if: ${{ !inputs.release_tag }}
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Windows x64 installer
        if: ${{ !inputs.release_tag }}
        run: npm run tauri build -- --bundles nsis -- --locked
      - name: Install UI test drivers
        shell: pwsh
        run: |
          cargo install tauri-driver --locked
          if ($LASTEXITCODE -ne 0) { throw "Could not install tauri-driver" }
          $edge = (Get-Item "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$edge/edgedriver_win64.zip" -OutFile "$env:RUNNER_TEMP\edgedriver.zip"
          Expand-Archive "$env:RUNNER_TEMP\edgedriver.zip" "$env:RUNNER_TEMP\edgedriver"
          "$env:RUNNER_TEMP\edgedriver" >> $env:GITHUB_PATH
      - name: Install and exercise the app
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force windows-artifacts
          if ($env:PUBLISHED_RELEASE) {
            gh release download "$env:PUBLISHED_RELEASE" --repo "$env:GITHUB_REPOSITORY" --pattern Portfolio-Windows-x64-setup.exe --dir windows-artifacts
            if ($LASTEXITCODE -ne 0) { throw "Could not download published installer" }
          } else {
            $built = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
            if ($built.Count -ne 1) { throw "Expected one installer" }
            Copy-Item $built[0].FullName windows-artifacts/Portfolio-Windows-x64-setup.exe
          }
          $installer = (Resolve-Path windows-artifacts/Portfolio-Windows-x64-setup.exe).Path
          $destination = "$env:RUNNER_TEMP\PortfolioInstall"
          $install = Start-Process $installer -ArgumentList "/S", "/D=$destination" -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer failed with $($install.ExitCode)" }
          $env:PORTFOLIO_DATA_DIR = "$env:RUNNER_TEMP\PortfolioSmokeData"
          python scripts/windows-smoke.py "$destination\portfolio.exe"
          if ($LASTEXITCODE -ne 0) { throw "Desktop smoke test failed" }
          Get-FileHash windows-artifacts/Portfolio-Windows-x64-setup.exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Portfolio-Windows-x64
          path: windows-artifacts/
          retention-days: 14
          if-no-files-found: ignore
